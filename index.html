<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/4/47/Claude_AI_logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Clone</title>
  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Import Noto Sans Arabic, Noto Naskh Arabic, and Noto Kufi Arabic -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@100..900&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            claude: {
              bg: '#18181b', // Main content background (Zinc 950)
              sidebar: '#131316', // Sidebar background (Darker)
              panel: '#27272a', // Input/Cards background (Zinc 800)
              accent: '#d97757', // Burnt orange
              text: '#ececec', // Primary text
              muted: '#a1a1aa' // Secondary text
            }
          },
          fontFamily: {
            serif: ['"Tiempos Headline"', 'Georgia', '"Noto Naskh Arabic"', 'serif'],
            sans: ['Inter', '"Noto Sans Arabic"', 'system-ui', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace'],
            // Specific stacks for settings
            // System: Fallback to Noto Sans Arabic if system-ui lacks Arabic
            system: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Noto Sans Arabic"', 'sans-serif'],
            // Dyslexic: Use Noto Kufi Arabic for a distinct, clear look for Arabic since Comic Sans lacks it
            dyslexic: ['"Comic Sans MS"', '"Chalkboard SE"', '"Comic Neue"', '"Noto Kufi Arabic"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #18181b;
      color: #ececec;
    }

    /* Custom scrollbar to match the dark theme */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #18181b;
    }

    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
